name: Test DocuThinker
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OTEL_SDK_DISABLED: "true"
      CREWAI_TELEMETRY_ENABLED: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and syntax
        run: |
          ruff check app scripts tests
          python -m compileall -q app scripts
          node --check app/static/app.js
          bash -n start.sh
          bash -n scripts/test_offline.sh
      - name: Test with real Milvus and CrewAI orchestration
        run: DOCUTHINKER_TEST_PYTHON="$(command -v python)" bash scripts/test_offline.sh --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
